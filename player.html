<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VK Player</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#000; overflow:hidden; }
  #player { width:100%; height:100%; position:relative; }
  iframe { width:100%; height:100%; border:none; display:block; }
  #overlay {
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:#000; transition:opacity .5s;
  }
  #overlay.hidden { opacity:0; pointer-events:none; }
</style>
</head>
<body>
<div id="player">
  <iframe id="vk-iframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
  <div id="overlay"></div>
</div>
<script>
const LS_CURRENT = 'vk_player_current';
const LS_CMD     = 'vk_player_cmd';

let currentId = null;

function buildEmbed(oid, id) {
  return `https://vk.com/video_ext.php?oid=${oid}&id=${id}&hd=2&autoplay=1`;
}

function checkState() {
  const raw = localStorage.getItem(LS_CURRENT);
  if (!raw) {
    document.getElementById('vk-iframe').src = '';
    document.getElementById('overlay').classList.remove('hidden');
    currentId = null;
    return;
  }
  const item = JSON.parse(raw);
  const id = item.oid + '_' + item.id;
  if (id !== currentId) {
    currentId = id;
    document.getElementById('vk-iframe').src = buildEmbed(item.oid, item.id);
    document.getElementById('overlay').classList.add('hidden');
  }
}

// Poll for changes every 500ms
setInterval(checkState, 500);
checkState();
</script>
</body>
</html>
